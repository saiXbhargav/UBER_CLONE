<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Map with a RideX route from pickup to drop-off">
  <rect width="600" height="400" fill="#eef2ef"/>
  <!-- parks and water -->
  <path d="M0 300c60-20 110-10 160 20s120 40 180 20 150-60 260-40v100H0z" fill="#cde6f2"/>
  <rect x="380" y="40" width="150" height="90" rx="14" fill="#d5ecd9"/>
  <rect x="40" y="170" width="110" height="70" rx="12" fill="#d5ecd9"/>
  <!-- street grid -->
  <g stroke="#fff" stroke-linecap="round">
    <path d="M0 60h600M0 150h600M0 250h600M90 0v400M220 0v400M350 0v400M480 0v400" stroke-width="14"/>
    <path d="M0 105h600M0 200h600M155 0v400M285 0v400M415 0v400M545 0v400" stroke-width="6"/>
    <path d="M0 380L600 20" stroke-width="18"/>
  </g>
  <g stroke="#dfe5e1" stroke-width="2" fill="none">
    <path d="M0 380L600 20"/>
  </g>
  <!-- route -->
  <path d="M120 330V250h100v-100h130V60h110" fill="none" stroke="#0a0a0a" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M120 330V250h100v-100h130V60h110" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
  <!-- pickup -->
  <circle cx="120" cy="330" r="22" fill="#10b981" opacity=".2"/>
  <circle cx="120" cy="330" r="12" fill="#0a0a0a" stroke="#fff" stroke-width="4"/>
  <circle cx="120" cy="330" r="4" fill="#fff"/>
  <!-- drop-off -->
  <rect x="448" y="48" width="24" height="24" rx="5" fill="#0a0a0a" stroke="#fff" stroke-width="4"/>
  <rect x="456" y="56" width="8" height="8" fill="#fff"/>
  <!-- car on route -->
  <g transform="translate(220 200)">
    <circle r="22" fill="#fff"/>
    <circle r="22" fill="none" stroke="#0a0a0a" stroke-opacity=".08" stroke-width="6"/>
    <rect x="-11" y="-7" width="22" height="14" rx="4" fill="#0a0a0a"/>
    <rect x="-6" y="-4" width="12" height="5" rx="1.5" fill="#cfe9f5"/>
    <circle cx="-6" cy="8" r="3" fill="#0a0a0a"/><circle cx="6" cy="8" r="3" fill="#0a0a0a"/>
  </g>
</svg>
